const hv=`attribute vec3 iP;attribute vec4 iD;attribute float aH;uniform float uT;uniform vec2 uW;varying vec2 vU;varying float vH,vS,vF;
void main(){float t=aH>.5?1.:position.y;vec3 p;
 if(aH>.5)p=vec3(position.xy*iD.x*.22,0.)+vec3(0.,iD.x,0.);
 else{float w=(.07+.05*iD.z)*iD.x;p=vec3(position.x*w*cos(iD.y),t*iD.x,position.x*w*sin(iD.y));}
 float ph=iD.w+iP.x*.5+iP.z*.25,gust=.5+.5*sin(uT*.35-iP.x*.08+iP.z*.04);
 float b=(.16+.5*gust+.22*sin(uT*1.9+ph))*t*t*iD.x*.55;
 p.xz+=uW*b;p.y-=b*b*.4;
 vec4 mv=modelViewMatrix*vec4(p+iP,1.);gl_Position=projectionMatrix*mv;
 vU=uv;vH=aH;vS=mix(.04,.5,pow(t,1.4))*(.6+.8*iD.z);vF=smoothstep(8.,45.,-mv.z);}`;
const hf='uniform sampler2D uM;varying vec2 vU;varying float vH,vS,vF;void main(){vec3 c=vec3(vS);if(vH>.5){vec4 t=texture2D(uM,vU);if(t.a<.5)discard;c=t.rgb;}c=mix(c,vec3(.72),vF*.85);gl_FragColor=vec4(c,1.);}';
function inst(n,flower,fn){
 const gm=new THREE.InstancedBufferGeometry(),P=[],U=[],A=[],I=[];
 for(let i=0;i<5;i++){const t=i/4,w=.5*(1-.95*t);P.push(-w,t,0,w,t,0);U.push(0,0,0,0);A.push(0,0);if(i)I.push(2*i-2,2*i-1,2*i,2*i-1,2*i+1,2*i)}
 if(flower){P.push(-.5,-.5,0,.5,-.5,0,.5,.5,0,-.5,.5,0);U.push(0,0,1,0,1,1,0,1);A.push(1,1,1,1);I.push(10,11,12,10,12,13)}
 const ip=new Float32Array(n*3),id=new Float32Array(n*4);
 for(let i=0;i<n;i++){const o=fn();ip.set(o.p,i*3);id.set(o.d,i*4)}

 gm.setAttribute('aH',new THREE.Float32BufferAttribute(A,1));gm.setIndex(I);
 gm.setAttribute('iP',new THREE.InstancedBufferAttribute(ip,3));gm.setAttribute('iD',new THREE.InstancedBufferAttribute(id,4));gm.instanceCount=n;
 const m=new THREE.Mesh(gm,new THREE.ShaderMaterial({vertexShader:hv,fragmentShader:hf,side:THREE.DoubleSide,uniforms:{uT,uW:{value:wind},uM:{value:flowerTex}}}));
 m.frustumCulled=false;S.add(m)}

br.forEach(([a,b,r],i)=>{const d=b.clone().sub(a),l=d.length();Q.setFromUnitVectors(UP,d.normalize());M.compose(a.clone().add(b).multiplyScalar(.5),Q,new THREE.Vector3(r,l,r));bi.setMatrixAt(i,M)});

function flap(m,t){
